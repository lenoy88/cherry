<script>
  const photo = document.querySelector(".portrait img");
  const musicButton = document.getElementById("musicButton");
  const heroMusic = document.getElementById("heroMusic");
  const videoContainer = document.getElementById("videoContainer");
  const musicStatus = document.getElementById("musicStatus");

  let player;
  let ready = false;
  let playing = false;

  // Make her picture clickable and keyboard accessible.
  photo.style.cursor = "pointer";
  photo.tabIndex = 0;
  photo.setAttribute("role", "button");
  photo.setAttribute("aria-label", "Play music");
  photo.setAttribute("aria-pressed", "false");
  photo.title = "Click to play or pause music";

  function updateControls() {
    const label = playing ? "⏸ Pause music" : "▶ Play music";

    musicButton.textContent = label;
    heroMusic.textContent = label;

    photo.setAttribute("aria-pressed", String(playing));
    photo.setAttribute(
      "aria-label",
      playing ? "Pause music" : "Play music"
    );

    musicStatus.textContent = playing
      ? "Music is playing. Keep browsing! Click her picture to pause."
      : "Click her picture to play music.";
  }

  function createPlayer() {
    videoContainer.replaceChildren();

    const container = document.createElement("div");
    container.id = "youtubePlayer";
    videoContainer.appendChild(container);

    player = new YT.Player("youtubePlayer", {
      width: "100%",
      height: "220",
      videoId: "5rjB5JT9RC0",
      playerVars: {
        playsinline: 1,
        rel: 0,
        loop: 1,
        playlist: "5rjB5JT9RC0"
      },
      events: {
        onReady(event) {
          ready = true;
          event.target.setVolume(60);
          musicStatus.textContent =
            "Click her picture to play music.";
        },

        onStateChange(event) {
          playing = event.data === YT.PlayerState.PLAYING;
          updateControls();
        },

        onError() {
          playing = false;
          updateControls();
          musicStatus.textContent =
            "This video cannot play here. Use Open in YouTube below.";
        }
      }
    });
  }

  function toggleMusic() {
    if (!ready) {
      musicStatus.textContent =
        "Music is loading. Try clicking her picture again in a moment.";
      return;
    }

    if (playing) {
      player.pauseVideo();
    } else {
      player.unMute();
      player.playVideo();
    }
  }

  photo.addEventListener("click", toggleMusic);

  photo.addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggleMusic();
    }
  });

  musicButton.addEventListener("click", toggleMusic);
  heroMusic.addEventListener("click", toggleMusic);

  window.onYouTubeIframeAPIReady = createPlayer;

  if (window.YT && window.YT.Player) {
    createPlayer();
  } else {
    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  }

  updateControls();
</script>
