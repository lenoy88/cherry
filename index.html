<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d92c42">
  <title>Cherry’s Table | Chef Tyleletha Cherry</title>

  <style>
    :root {
      --red: #d92c42;
      --yellow: #ffe06b;
      --cream: #fff9ec;
      --brown: #452526;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    button,
    a,
    input {
      touch-action: manipulation;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid #355e43;
      outline-offset: 5px;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      color: var(--red);
      font: bold 26px Georgia, serif;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 40px 6% 70px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 60px;
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      background: var(--yellow);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }
