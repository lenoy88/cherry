<script>
  const photo = document.getElementById("photoMusic");
  const caption = document.getElementById("photoCaption");
  const hint = document.getElementById("photoHint");
  const heroPlay = document.getElementById("heroMusic");
  const musicPlay = document.getElementById("musicButton");
  const status = document.getElementById("musicStatus");
  const volume = document.getElementById("volume");

  let player;
  let ready = false;

  function message(text) {
    if (hint) hint.textContent = text;
    if (status) status.textContent = text;
  }

  function updateButtons(playing) {
    const label = playing ? "⏸ Pause music" : "▶ Play music";

    [heroPlay, musicPlay].forEach(function(button) {
      if (button) button.textContent = label;
    });

    [photo, heroPlay, musicPlay].forEach(function(button) {
      if (button) {
        button.setAttribute("aria-pressed", String(playing));
      }
    });

    if (photo) {
      photo.setAttribute(
        "aria-label",
        playing ? "Pause music" : "Play music"
      );
    }

    if (caption) {
      caption.textContent = playing
        ? "⏸ Click my picture to pause 🍒"
        : "▶ Click my picture to play 🍒";
    }
  }

  function toggleMusic() {
    if (!ready) {
      message("Player loading. Click her picture again shortly.");
      return;
    }

    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.unMute();
      player.playVideo();

      message(
        "Starting music. If needed, press Play on the video below."
      );
    }
  }

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player("youtubePlayer", {
      width: "100%",
      height: "100%",
      videoId: "kFZxHg1wK24",

      playerVars: {
        playsinline: 1,
        rel: 0,
        loop: 1,
        playlist: "kFZxHg1wK24"
      },

      events: {
        onReady: function(event) {
          ready = true;

          event.target.setVolume(
            volume ? Number(volume.value) : 60
          );

          message("Ready! Click Ty Ty’s picture to play music.");
        },

        onStateChange: function(event) {
          const playing =
            event.data === YT.PlayerState.PLAYING;

          updateButtons(playing);

          if (playing) {
            message("♫ Music playing — keep browsing!");
          } else if (event.data === YT.PlayerState.PAUSED) {
            message("Paused. Click her picture to continue.");
          } else if (event.data === YT.PlayerState.BUFFERING) {
            message("Music loading…");
          }
        },

        onError: function() {
          updateButtons(false);
          message(
            "YouTube could not play this video here. " +
            "Try the video’s Watch on YouTube link."
          );
        }
      }
    });
  };

  [photo, heroPlay, musicPlay].forEach(function(button) {
    if (button) {
      button.addEventListener("click", toggleMusic);
    }
  });

  if (volume) {
    volume.addEventListener("input", function() {
      if (ready) player.setVolume(Number(volume.value));
    });
  }

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";

  script.onerror = function() {
    message("YouTube could not load. Refresh the page to try again.");
  };

  document.head.appendChild(script);
  updateButtons(false);
</script>
