<audio id="backgroundMusic" loop preload="none">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById("backgroundMusic");
  const photo = document.getElementById("photoMusic");
  const caption = document.getElementById("photoCaption");
  const hint = document.getElementById("photoHint");
  const heroPlay = document.getElementById("heroMusic");
  const musicPlay = document.getElementById("musicButton");
  const status = document.getElementById("musicStatus");
  const volume = document.getElementById("volume");

  audio.volume = 0.6;

  function updateButtons() {
    const playing = !audio.paused;
    const label = playing ? "⏸ Pause music" : "▶ Play music";

    [heroPlay, musicPlay].forEach(function(button) {
      if (button) {
        button.textContent = label;
        button.setAttribute("aria-pressed", String(playing));
      }
    });

    if (photo) {
      photo.setAttribute("aria-pressed", String(playing));
      photo.setAttribute(
        "aria-label",
        playing ? "Pause music" : "Play music"
      );
    }

    if (caption) {
      caption.textContent = playing
        ? "⏸ Click my picture to pause 🍒"
        : "▶ Click my picture to play 🍒";
    }
  }

  function message(text) {
    if (hint) hint.textContent = text;
    if (status) status.textContent = text;
  }

  async function toggleMusic() {
    if (!audio.paused) {
      audio.pause();
      return;
    }

    try {
      await audio.play();
    } catch (error) {
      message("Upload music.mp3 beside index.html to play music.");
    }
  }

  [photo, heroPlay, musicPlay].forEach(function(button) {
    if (button) {
      button.addEventListener("click", toggleMusic);
    }
  });

  audio.addEventListener("playing", function() {
    updateButtons();
    message("♫ Music playing — enjoy the menu!");
  });

  audio.addEventListener("pause", function() {
    updateButtons();
    message("Music paused. Click her picture to play.");
  });

  audio.addEventListener("error", function() {
    message("Check that your audio file is named music.mp3.");
  });

  if (volume) {
    audio.volume = Number(volume.value) / 100;

    volume.addEventListener("input", function() {
      audio.volume = Number(volume.value) / 100;
    });
  }

  updateButtons();
  message("Click her picture first to start the music.");
</script>
