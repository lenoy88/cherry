<!-- Music loads only after clicking Ty Ty's picture. -->
<div id="backgroundPlayer" hidden></div>

<script>
  const welcome = document.getElementById("welcomeScreen");
  const restaurant = document.getElementById("restaurantPage");
  const enterButton = document.getElementById("enterButton");
  const photo = document.getElementById("photoMusic");
  const caption = document.getElementById("photoCaption");
  const heroPlay = document.getElementById("heroMusic");
  const musicPlay = document.getElementById("musicButton");
  const hint = document.getElementById("photoHint");
  const status = document.getElementById("musicStatus");
  const volume = document.getElementById("volume");
  const container = document.getElementById("backgroundPlayer");

  let frame = null;
  let playing = false;

  function message(text) {
    if (hint) hint.textContent = text;
    if (status) status.textContent = text;
  }

  function updateButtons() {
    [photo, heroPlay, musicPlay].forEach(function(button) {
      if (button) {
        button.setAttribute("aria-pressed", String(playing));
      }
    });

    [heroPlay, musicPlay].forEach(function(button) {
      if (button) {
        button.textContent = playing
          ? "■ Stop music"
          : "▶ Play music";
      }
    });

    if (caption) {
      caption.textContent = playing
        ? "■ Click my picture to stop 🍒"
        : "▶ Click my picture for music 🍒";
    }

    if (photo) {
      photo.setAttribute(
        "aria-label",
        playing ? "Stop music" : "Play music"
      );
    }
  }

  function startMusic() {
    if (frame) return;

    frame = document.createElement("iframe");

    frame.src =
      "https://www.youtube.com/embed/zGPFqYi4aPs" +
      "?autoplay=1&loop=1&playlist=zGPFqYi4aPs&playsinline=1";

    frame.title = "Cherry’s Table soundtrack";
    frame.allow = "autoplay; encrypted-media";
    frame.setAttribute("tabindex", "-1");

    container.replaceChildren(frame);

    playing = true;
    updateButtons();

    message(
      "Music requested. If you hear nothing, YouTube may be blocking background playback."
    );
  }

  function stopMusic() {
    container.replaceChildren();
    frame = null;
    playing = false;

    updateButtons();
    message("Music stopped. Click her picture to start again.");
  }

  function toggleMusic() {
    if (playing) {
      stopMusic();
    } else {
      startMusic();
    }
  }

  enterButton.addEventListener("click", function() {
    // Start the music directly from her picture click.
    startMusic();

    welcome.hidden = true;
    restaurant.hidden = false;

    const heading = document.getElementById("pageHeading");
    if (heading) heading.focus({ preventScroll: true });

    window.scrollTo(0, 0);
  });

  [photo, heroPlay, musicPlay].forEach(function(button) {
    if (button) {
      button.addEventListener("click", toggleMusic);
    }
  });

  // This embed uses YouTube's volume, so remove the old MP3 slider.
  if (volume) {
    const control = volume.closest(".volume-control");
    if (control) control.hidden = true;
  }

  updateButtons();
</script>
